[pytest]
testpaths = tests

# Put the repository root on sys.path so `agent` and `eval` import.
#
# This is not cosmetic. `python -m pytest` silently adds the working directory
# to sys.path, so the suite passes that way with or without this line. The bare
# `pytest` console script does not, and `tests/conftest.py` imports
# `agent.config` at module scope -- so without this, a clean clone running the
# command the README documents fails with `ImportError while loading conftest`
# and pytest exit code 4, before collecting a single test.
#
# `tests/` deliberately has no __init__.py, which is why pytest's default
# `prepend` import mode inserts `tests/` rather than the root.
pythonpath = .

addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning:botocore.*
